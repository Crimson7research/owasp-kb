name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      # No GH_TOKEN: fetch.py uses public HTTPS and git, so CI needs no credentials.
      - name: Fetch pinned sources
        run: |
          python -c "
          from pathlib import Path
          from owasp_kb.ingest.lock import load_lock
          from owasp_kb.ingest.fetch import fetch_all
          fetch_all(load_lock('sources.lock.yml'), Path('data'))
          "

      - name: Download embedding model
        run: python scripts/download_model.py

      - name: Build both indexes
        run: |
          python -m owasp_kb.ingest.build --sources data --out dist/owasp-kb-lite.sqlite
          python -m owasp_kb.ingest.build --sources data --out dist/owasp-kb-full.sqlite \
            --with-vectors

      - name: Retrieval quality gate
        run: pytest tests/test_retrieval_quality.py -v -s

      - name: Build images
        run: |
          docker build -f docker/Dockerfile --target lite -t owasp-kb:lite .
          docker build -f docker/Dockerfile --target full -t owasp-kb:full .

      - name: Container smoke test
        run: |
          chmod +x scripts/docker_smoke.sh
          ./scripts/docker_smoke.sh owasp-kb:lite lexical
          ./scripts/docker_smoke.sh owasp-kb:full hybrid
