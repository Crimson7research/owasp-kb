name: ci

# Paths that no job can be affected by. `test` reads a surprising amount of the
# tree -- licenses/NOTICE, README.md, docs/licensing.md, docs/stack.md, docs/kb-packs.md,
# the Dockerfile, the Makefile and every file under plugins/ are all asserted
# against -- so this list is deliberately narrow and is pinned by
# test_ci_ignores_only_paths_no_test_reads. A docs commit that touches
# docs/stack.md still runs, correctly.
#
# A PR touching only ignored paths gets no checks at all, which reads as
# "pending forever" to anything waiting on a conclusion rather than on a run
# existing.
on:
  pull_request:
    paths-ignore: &ignored
      - '.claude/skills/**'
      - 'docs/decisions/**'
  push:
    branches: [master]
    paths-ignore: *ignored

# One run per branch or PR. A rapid series of pushes to the same PR otherwise
# leaves several ~25-minute build jobs racing to verify commits already
# superseded. Cancelling is safe here because ci only verifies -- it publishes
# nothing, so an interrupted run leaves nothing half-done.
#
# Not on master: those runs are the record that a merged commit passed, and a
# later push cancelling an earlier one would leave a commit with no verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# packages: read so the build job can pull the digest the plugin ships and check it
# against sources.lock.yml. The package is private; contents alone cannot read it.
permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      # No GH_TOKEN: fetch.py uses public HTTPS and git, so CI needs no credentials.
      - name: Fetch pinned sources
        run: |
          python -c "
          from pathlib import Path
          from owasp_kb.ingest.lock import load_lock
          from owasp_kb.ingest.fetch import fetch_all
          fetch_all(load_lock('sources.lock.yml'), Path('data'))
          "

      # The test job runs before data/ exists, so every realdata test skips there.
      # Run them here, where the fetch has happened. Two guards keep a silent pass
      # impossible: `test -f` fails if the fetch did not produce the catalogue, so
      # the skip branch can never be taken; and `pytest -m` exits 5 when nothing
      # matches, so deleting a marker fails rather than quietly running nothing.
      - name: Real-catalogue assertions
        run: |
          test -f data/cwe/cwec_v4.20.xml
          pytest -m realdata -q --strict-markers

      - name: Download embedding model
        run: python scripts/download_model.py

      - name: Build both indexes
        run: |
          python -m owasp_kb.ingest.build --sources data --out dist/owasp-kb-lite.sqlite
          python -m owasp_kb.ingest.build --sources data --out dist/owasp-kb-full.sqlite \
            --with-vectors

      - name: Retrieval quality gate
        run: pytest tests/test_retrieval_quality.py -v -s

      - name: Build images
        run: |
          docker build -f docker/Dockerfile --target lite -t owasp-kb:lite .
          docker build -f docker/Dockerfile --target full -t owasp-kb:full .

      - name: Container smoke test
        run: |
          chmod +x scripts/docker_smoke.sh
          ./scripts/docker_smoke.sh owasp-kb:lite lexical
          ./scripts/docker_smoke.sh owasp-kb:full hybrid

      # The smoke test above checks images built from this commit. This checks the
      # reference the plugin actually ships -- a different question, and the one
      # the three deleted version-lockstep proxies were standing in for.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the shipped image reference
        run: |
          chmod +x scripts/verify_pin.sh
          ./scripts/verify_pin.sh
