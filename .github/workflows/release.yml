name: release

on:
  push:
    tags: ["v*"]

# Never cancelled. This publishes images to a registry, and a cancelled publish
# can leave a tag pointing at a partially uploaded manifest -- which is worse
# than a slow release, because the tag looks published. Grouped per tag so two
# releases cannot race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# contents and pull-requests are write because the release opens the pin pull
# request: an image digest is only knowable after the push, so the reference the
# plugin ships is written by this workflow rather than by hand.
permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Before the build, not after. The version is baked into the image at build time
      # and reported by kb_info as that build's identity, so a write that lands later
      # fixes the repository and leaves the artefact wrong -- which is what shipped at
      # v0.17.1. Early also means a tag this rejects fails the job before any image is
      # built, since the trigger glob is broader than the form a release may carry.
      # The same edit reaches master through the pin pull request below. See ADR 0016.
      - name: Write the release version
        run: python scripts/set_version.py --tag "${{ github.ref_name }}" --write

      - name: Install
        run: pip install -e '.[dev]'

      - name: Read pinned versions
        id: versions
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          packs = yaml.safe_load(open("sources.lock.yml"))["packs"]
          print(f"asvs={packs['asvs']['version']}")
          print(f"cs={packs['cheatsheets']['version']}")
          print(f"cwe={packs['cwe']['version']}")
          PY

      - name: Fetch sources and model
        run: |
          python -c "
          from pathlib import Path
          from owasp_kb.ingest.lock import load_lock
          from owasp_kb.ingest.fetch import fetch_all
          fetch_all(load_lock('sources.lock.yml'), Path('data'))
          "
          python scripts/download_model.py

      - name: Build indexes
        run: |
          python -m owasp_kb.ingest.build --sources data --out dist/owasp-kb-lite.sqlite
          python -m owasp_kb.ingest.build --sources data --out dist/owasp-kb-full.sqlite \
            --with-vectors

      - name: Quality gate
        run: pytest tests/test_retrieval_quality.py -v -s

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke test, then push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/owasp-kb
          ASVS: ${{ steps.versions.outputs.asvs }}
          CS: ${{ steps.versions.outputs.cs }}
          CWE: ${{ steps.versions.outputs.cwe }}
        run: |
          # GHCR requires a lowercase image path; repository_owner is "Crimson7research".
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          # Every pack in the index gets named in the immutable tag -- see the
          # PINNED_TAG comment in the Makefile for why CWE had to join it.
          PINNED="asvs$ASVS-cs$CS-cwe$CWE"
          for target in lite full; do
            docker build -f docker/Dockerfile --target "$target" \
              -t "$IMAGE_LC:$target" \
              -t "$IMAGE_LC:$target-$PINNED" .
          done
          chmod +x scripts/docker_smoke.sh
          # Smoke test gates the push: a broken image is never published.
          ./scripts/docker_smoke.sh "$IMAGE_LC:lite" lexical
          ./scripts/docker_smoke.sh "$IMAGE_LC:full" hybrid
          docker push --all-tags "$IMAGE_LC"

      - name: Capture the published digest
        id: digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/owasp-kb
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          # RepoDigests carries one entry per repository the image is tagged into,
          # so select this one rather than trusting index 0 to be it.
          DIGEST=$(docker image inspect "$IMAGE_LC:full" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^${IMAGE_LC}@sha256:" | head -1)
          if [ -z "$DIGEST" ]; then
            echo "no registry digest for $IMAGE_LC:full -- did the push run?" >&2
            docker image inspect "$IMAGE_LC:full" --format '{{.RepoDigests}}' >&2
            exit 1
          fi
          echo "full=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "captured $DIGEST"

      # After the push, so a failed smoke test never leaves a Release page naming
      # images that were never published. Drafted rather than published: delivery is
      # the pin pull request merging, and release-promote.yml publishes it then, so the
      # Releases page and what is installable agree. Guarded so a re-run for a
      # re-tagged release does not fail on an existing draft.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving it alone"
          else
            gh release create "$TAG" --draft --generate-notes
          fi

      # Writes two files: the digest into .mcp.json, and the pack versions this
      # release was built from into pinned-packs.json. Both have to reach master or
      # verify_pin checks the new digest against the previous release's packs.
      - name: Pin the plugin to the published image
        run: python scripts/pin_image.py --image "${{ steps.digest.outputs.full }}" --write

      - name: Open the pin pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release/pin-${{ github.ref_name }}
          base: master
          title: "Pin the plugin to the ${{ github.ref_name }} image"
          commit-message: "Pin the plugin to the ${{ github.ref_name }} image"
          add-paths: |
            src/owasp_kb/__init__.py
            plugins/owasp-kb/.mcp.json
            plugins/owasp-kb/pinned-packs.json
          body: |
            The images for ${{ github.ref_name }} are published and smoke-tested. This
            points the plugin at the `full` variant by digest, and records the pack
            versions that image holds so CI can check the two against each other.

            It also carries the version this release wrote, taken from the tag. The
            image was built with it; this is how the default branch catches up.

            Merging this is the delivery step: the marketplace is read from the
            default branch, so master is the surface devs install from.
