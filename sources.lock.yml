# Pinned upstream sources, bumped by CI via a reviewed PR. Each pack pins
# whatever identifies its upstream precisely -- a release tag, a commit SHA,
# or a numbered release -- see the per-pack comments below.
packs:
  asvs:
    type: checklist
    repo: OWASP/ASVS
    release: v5.0.0_release
    version: 5.0.0
    license: CC-BY-SA-4.0
    assets:
      - OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
    extra_paths:
      - 5.0/mappings/v5.0.be_cwe_mapping.json
      # Required to use the CWE mapping at all: it is keyed on bleeding-edge ids,
      # which are renumbered relative to 5.0.0 (measured: 0 of 345 are unchanged).
      - 5.0/mappings/mapping_v5.0.be_to_v5.0.0.yml
      - 5.0/mappings/nist.md
      - 5.0/mappings/mapping_v5.0.0_to_v4.0.3.yml
  aisvs:
    type: checklist
    repo: OWASP/AISVS
    release: v1.01
    version: "1.01"
    license: CC-BY-SA-4.0
    # The release's only asset is a PDF, so the frozen chapter Markdown is
    # fetched from the tag instead. Tag v1.01 carries both 1.0/ and 1.01/;
    # 1.01/LOCKED.md freezes 1.01/en/ and is the citable v1.01-Cx.y.z text, so
    # that folder is the one pinned. Appendices B and C are deliberately not
    # ingested -- see docs/kb-packs.md.
    extra_paths:
      - 1.01/en/0x10-C01-Training-Data-Integrity-and-Traceability.md
      - 1.01/en/0x10-C02-Input-Validation.md
      - 1.01/en/0x10-C03-Model-Lifecycle-Management.md
      - 1.01/en/0x10-C04-Infrastructure.md
      - 1.01/en/0x10-C05-Access-Control-and-Identity.md
      - 1.01/en/0x10-C06-Supply-Chain.md
      - 1.01/en/0x10-C07-Model-Behavior.md
      - 1.01/en/0x10-C08-Memory-Embeddings-and-Vector-Database.md
      - 1.01/en/0x10-C09-Orchestration-and-Agentic-Action.md
      - 1.01/en/0x10-C10-MCP-Security.md
      - 1.01/en/0x10-C11-Adversarial-Robustness.md
      - 1.01/en/0x10-C12-Monitoring-and-Logging.md
  cheatsheets:
    type: corpus
    repo: OWASP/CheatSheetSeries
    commit: 668ba7db3d0da5868b8a0305c259f7f6914a6ecd
    version: "20261004"
    license: CC-BY-SA-4.0
    paths:
      - cheatsheets/
      - IndexASVS.md
  cwe:
    type: catalogue
    version: "4.20"
    license: LicenseRef-CWE-TOU
    # Not an OWASP project. Present because ASVS maps to it. A numbered release
    # rather than cwec_latest.xml.zip: a citation must resolve to the same
    # weakness text for as long as the image exists.
    url: https://cwe.mitre.org/data/xml/cwec_v4.20.xml.zip
  masvs:
    type: checklist
    repo: OWASP/masvs
    release: v2.1.0
    version: "2.1.0"
    license: CC-BY-SA-4.0
    # The release also ships pdf, epub and a CycloneDX SBOM; only the YAML is
    # ingestable. `version` is pinned here and never read from the document, so
    # a citation's version cannot shift on a re-fetch. The release asset itself
    # stamps `metadata.version: v2.1.0` -- the `v` prefix means it is not
    # string-equal to the `2.1.0` pinned above; strip it before comparing.
    assets:
      - OWASP_MASVS.yaml
