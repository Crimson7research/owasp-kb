# Pinned upstream sources. ASVS pins a release tag; the Cheat Sheet Series rolls
# continuously so it pins a commit SHA. Bumped by CI via a reviewed PR.
packs:
  asvs:
    type: checklist
    repo: OWASP/ASVS
    release: v5.0.0_release
    version: 5.0.0
    license: CC-BY-SA-4.0
    assets:
      - OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
    extra_paths:
      - 5.0/mappings/v5.0.be_cwe_mapping.json
      # Required to use the CWE mapping at all: it is keyed on bleeding-edge ids,
      # which are renumbered relative to 5.0.0 (measured: 0 of 345 are unchanged).
      - 5.0/mappings/mapping_v5.0.be_to_v5.0.0.yml
      - 5.0/mappings/nist.md
      - 5.0/mappings/mapping_v5.0.0_to_v4.0.3.yml
  cheatsheets:
    type: corpus
    repo: OWASP/CheatSheetSeries
    commit: 7d1c2d3daf632206e8f2c685214c699ff8f11938
    version: "20260724"
    license: CC-BY-SA-4.0
    paths:
      - cheatsheets/
      - IndexASVS.md
  cwe:
    type: catalogue
    version: "4.20"
    license: LicenseRef-CWE-TOU
    # Not an OWASP project. Present because ASVS maps to it. A numbered release
    # rather than cwec_latest.xml.zip: a citation must resolve to the same
    # weakness text for as long as the image exists.
    url: https://cwe.mitre.org/data/xml/cwec_v4.20.xml.zip
