# Facts about this repository's CI that cannot be read off .github/workflows/.
# Discovered once; see the local-ci-act skill.
ci:
  runner: act
  pr_workflows:
    - ci.yml
  # ci.yml triggers on `pull_request` with no draft gate, so a push to a branch
  # with an open non-draft PR starts both jobs, and `gh pr ready` is itself a
  # billed event. The other three workflows are not PR-triggered: release.yml
  # fires on `v*` tags, release-promote.yml on a closed PR, refresh.yml on a
  # weekly schedule.
  draft_gated: false
  # ubuntu-latest on a private repository. Confirmed via `gh repo view`.
  billed: true
  runner_image: catthehacker/ubuntu:act-24.04
  known_unrunnable:
    - job: build
      reason: >-
        Fetches the pinned upstream OWASP and CWE corpora, downloads the
        sentence-transformers embedding model, builds both sqlite indexes
        including vectors, and builds two docker images. Locally that costs far
        more time than the billed run and needs network egress. Run it on the
        runner; run `test` locally, which is where lint and the unit suite live.
