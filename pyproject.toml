[project]
name = "owasp-kb"
version = "0.1.0"
description = "OWASP ASVS and Cheat Sheet knowledge bases as an MCP server"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mcp>=1.28.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
embed = ["onnxruntime>=1.18", "tokenizers>=0.19", "numpy>=1.26"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "owasp-kb[embed]",
]

[project.scripts]
owasp-kb-build = "owasp_kb.ingest.build:main"
owasp-kb-server = "owasp_kb.server.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff formats Python code blocks inside markdown. The plan and spec documents
# record what was specified and executed, so reformatting them produces a large
# diff of noise over content that is deliberately frozen.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
